name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Compile-time checked SQL reads the committed backend/.sqlx/ metadata,
  # so CI never needs a database to build.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (fmt, clippy, test, offline build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p library-backend

  types:
    name: Generated TypeScript types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same command as `make types`; it rewrites frontend-react/src/generated/.
      - run: cargo test -p library-shared --features ts
      - name: Fail if regenerating changed anything
        run: git diff --exit-code -- frontend-react/src/generated

  react:
    name: React (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  leptos:
    name: Leptos (wasm clippy, trunk build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo clippy -p library-frontend-leptos --target wasm32-unknown-unknown -- -D warnings
      - run: trunk build --release
        working-directory: frontend-leptos
